name: Deploy site

# Publishes the site on every push to main. Set the repository variable DEPLOY_TARGET to choose the host:
#   cloudflare    Cloudflare Pages (put Cloudflare Access in front of it for a login). Needs the secrets
#                 CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID; CF_PAGES_PROJECT names the project.
#   github-pages  GitHub Pages at /congress_insights/. No login: anyone with the link can read it.
# With DEPLOY_TARGET unset nothing is published. Setup steps are in docs/hosting.md.
on:
  push:
    branches: [main]
    paths: ['site/**', 'briefs/**', 'data/**', 'goals/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    if: vars.DEPLOY_TARGET == 'cloudflare' || vars.DEPLOY_TARGET == 'github-pages'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    env:
      SITE_BASE: ${{ vars.DEPLOY_TARGET == 'github-pages' && '/congress_insights' || '/' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      # Keep crawlers out whichever host is used.
      - run: "printf 'User-agent: *\\nDisallow: /\\n' > dist/robots.txt"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  cloudflare:
    needs: build
    if: vars.DEPLOY_TARGET == 'cloudflare'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
      - run: mkdir dist && tar -xf artifact.tar -C dist
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CF_PAGES_PROJECT || 'congress-insights' }}
        run: |
          npx --yes wrangler@4.20.0 pages project create "$PROJECT" --production-branch=main 2>/dev/null || true
          npx --yes wrangler@4.20.0 pages deploy dist --project-name="$PROJECT" --branch=main --commit-dirty=true

  github-pages:
    needs: build
    if: vars.DEPLOY_TARGET == 'github-pages'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
