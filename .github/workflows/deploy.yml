name: Deploy site

# Publishes the site to GitHub Pages on every push to main when the repository variable DEPLOY_TARGET is
# github-pages. No login: anyone with the link can read every page, including the caucus workspace under /caucus/.
# The recommended host is Cloudflare Workers, which builds and deploys from the repo itself (Workers Builds) and
# needs nothing here. Setup steps are in docs/hosting.md.
on:
  push:
    branches: [main]
    paths: ['site/**', 'briefs/**', 'data/**', 'goals/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    if: vars.DEPLOY_TARGET == 'github-pages'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    env:
      SITE_BASE: /congress_insights
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  github-pages:
    needs: build
    if: vars.DEPLOY_TARGET == 'github-pages'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
