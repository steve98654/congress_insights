id: appropriations-on-time
title: Fund the government on time
area: Appropriations
summary: Pass all 12 appropriations bills by the deadline instead of shutdowns and stopgaps, and keep surface transportation funding at FY2026 levels in the FY2027 THUD bill.
psc_ask: Negotiate and pass all 12 appropriations bills on time; restore highway, airport and transit funding (about $19B in proposed cuts) in FY2027 THUD.
