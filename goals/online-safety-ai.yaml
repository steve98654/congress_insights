id: online-safety-ai
title: Make AI safe and protect deepfake victims
area: Technology
summary: Let victims of non-consensual intimate deepfakes sue the people who make or share them, and press for US leadership on AI safety standards. The caucus started an AI working group in September 2026.
psc_ask: House passage of the DEFIANCE Act, which the Senate already passed; the administration should lead on AI safety standards and US-China AI safety coordination.
endorsed: '2026-09-24'
sources:
- https://problemsolverscaucus.house.gov/media/press-releases/problem-solvers-caucus-endorses-defiance-act-to-allow-victims-of-non-consensual-deepfakes-to-sue-perpetrators
- https://problemsolverscaucus.house.gov/news/documentsingle.aspx?DocumentID=921
- https://problemsolverscaucus.house.gov/news/documentsingle.aspx?DocumentID=917
committees: [HSSY, HSIF, SSCM]
